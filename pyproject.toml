[project]
name = "friday"
version = "0.1.0"
description = "Personal three-layer second-brain system: Archive → Memory → Synthesis"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.97.0",
    "google-api-python-client>=2.195.0",
    "google-auth-oauthlib>=1.3.1",
    "keyring>=25.7.0",
    "mail-parser>=4.2.1",
    "openai>=2.33.0",
    "pdfplumber>=0.11.9",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "slack-sdk>=3.41.0",
    "watchdog>=6.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
